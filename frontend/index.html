<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Fleetra — Ağıllı Logistika. Real Vaxt Rejimində İdarəetmə.</title>
    <script>
      // Tünd rejim atributunu React yüklənməzdən əvvəl qoyur ki, səhifə
      // açılışında qısa "işıqlı flash" görünməsin (bax utils/theme.js —
      // eyni localStorage açarından oxuyur).
      try {
        if (localStorage.getItem('fleetra_theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
