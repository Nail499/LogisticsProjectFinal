spring.application.name=LogisticsProject
spring.datasource.url=jdbc:postgresql://localhost:5432/lms_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Controller-lərdə hər yerdə "throw new RuntimeException("...")" ilə atılan
# mesajların frontend-ə (axios err.response.data.message) çatması üçün —
# Spring Boot-un defolt error handler-i (@ExceptionHandler olmadıqda) bu
# sahəni default olaraq "never" saxlayır (təhlükəsizlik səbəbi ilə daxili
# stack trace-lər sızmasın deyə), amma bu layihədə RuntimeException mesajları
# qəsdən istifadəçiyə göstərilməli olan Azərbaycanca mətnlərdir (məs. "Bu
# müştəriyə aid istifadəçi hesabı tapılmadı"), texniki detal deyil.
server.error.include-message=always

# DigitalOcean App Platform-un sağlamlıq yoxlaması üçün (bax .do/app.yaml,
# SecurityConfig#webSecurityCustomizer) — yalnız /actuator/health açıq
# saxlanılır, digər actuator endpoint-ləri (env, beans, və s.) qapalıdır.
management.endpoints.web.exposure.include=health

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Email tesdiq kodu (qeydiyyat) ve sifre berpasi kodu gondermek ucun.
# Gmail SMTP + "App Password" istifade olunur (adi Gmail sifresi ISLEMIR -
# Google hesabinda 2 addimli teshis aktiv edilib myaccount.google.com/apppasswords
# unvanindan 16 xanali "app password" yaradilmalidir). MAIL_USERNAME/MAIL_PASSWORD
# muhit deyisenleri (DB_PASSWORD/JWT_SECRET ile eyni pattern) IntelliJ run
# konfiqurasiyasinda teyin olunmalidir.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME}

# Bildiriş email-lərindəki "Bax" düyməsinin hara yönləndirəcəyini qurmaq
# üçün (backend özü frontend route-larını bilmir, ona görə mütləq URL
# lazımdır). CORS siyahısındakı (bax SecurityConfig#corsConfigurationSource)
# dev origin ilə eynidir; production-da başqa domenə yönləndirmək üçün
# env dəyişəni ilə override edilə bilər.
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Stripe test rejimi açarları (bax .idea/workspace.xml envs — DB_PASSWORD/
# MAIL_USERNAME ile eyni pattern). Publishable key frontend-e /api/payments/config
# ucun geri qaytarilir, secret key yalniz backend-de PaymentIntent yaratmaq ucun islenir.
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.secret-key=${STRIPE_SECRET_KEY}

# Brauzer push bildirişləri (Web Push + VAPID) — açarlar eyni env pattern
# ilə (bax .idea/workspace.xml). npx web-push generate-vapid-keys ilə
# yaradılıb, heç bir xarici hesab/qeydiyyat tələb etmir.
vapid.public-key=${VAPID_PUBLIC_KEY}
vapid.private-key=${VAPID_PRIVATE_KEY}
vapid.subject=mailto:${MAIL_USERNAME}

# AI destek chati (Musteri/Surucu/Dispetcer panelleri) - Groq-un OpenAI-uygun
# "chat completions" API-yə tool-use ile muraciet edir (bax AiChatService,
# AiToolExecutor). Groq pulsuzdur (kredit kartı telep etmir), acari
# console.groq.com-dan alinir. GROQ_API_KEY teyin olunmayibsa (defolt bos
# setr) tetbiq YENE DE ACHILIR - AiChatService bu halda sadece "hele
# konfiqurasiya edilmeyib" mesaji qaytarir, DB_PASSWORD/STRIPE_* kimi
# mecburi deyil.
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}