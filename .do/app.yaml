# DigitalOcean App Platform tətbiq spesifikasiyası (App Spec).
# Tətbiqi (istənilən konfiqurasiya ilə) əvvəlcə DO-nun sehrbazı ilə yarat,
# sonra Settings → App Spec → Edit bölməsindən bu faylın məzmununu yapışdır
# (DO artıq yaratma zamanı birbaşa YAML yapışdırmağa icazə vermir). Addım-
# addım təlimat üçün bax DEPLOY.md.
#
# QEYD: SECRET tipli env dəyişənlərin dəyəri burada YAZILMIR (təhlükəsizlik
# üçün) — App Platform UI-də hər biri üçün sənə xüsusi sətir göstərəcək,
# orada real dəyərləri əl ilə daxil edəcəksən.
#
# QEYD 2: DO artıq hər komponentə ayrıca subdomain vermir — bütün komponentlər
# TƏK domendə (App Spec-in "ingress" bölməsi) path-əsaslı marşrutlanır.
# Ona görə frontend "/" olaraq, backend isə özünün bütün real path-ləri
# (/api, /ws, /uploads, /swagger-ui, /v3/api-docs, /actuator) ilə ayrıca
# qeyd olunub — əks halda bu path-lər "/" tutucu qaydasına düşüb səhv
# olaraq frontend-ə yönləndirilərdi.
name: fleetra

services:
  - name: backend
    source_dir: /
    dockerfile_path: Dockerfile
    github:
      repo: Nail499/LogisticsProjectFinal
      branch: master
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    # 512MB (apps-s-1vcpu-0.5gb, $5/ay) Spring Boot + Hibernate + Security +
    # WebSocket üçün çox az ola bilər (OOM riski) — 1GB ($10/ay) təhlükəsiz
    # minimumdur. Bax DEPLOY.md "Xərc" bölməsi.
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    health_check:
      http_path: /actuator/health
    envs:
      # Verilənlər bazası — "db" komponentindən avtomatik bağlanır, əl ilə
      # heç nə yazmırsan.
      - key: SPRING_DATASOURCE_URL
        value: ${db.JDBC_DATABASE_URL}
      - key: SPRING_DATASOURCE_USERNAME
        value: ${db.USERNAME}
      - key: SPRING_DATASOURCE_PASSWORD
        value: ${db.PASSWORD}
        type: SECRET

      # Frontend ilə backend indi EYNİ domendədir (bax aşağıdakı ingress
      # bölməsi), ona görə tətbiqin ümumi ünvanı (${APP_URL}) istifadə
      # olunur — email-lərdəki "Bax" düyməsi üçün (bax application.properties
      # app.frontend.url).
      - key: FRONTEND_URL
        value: ${APP_URL}

      # Aşağıdakılar SECRET-dir — dəyərləri App Platform UI-də əl ilə
      # daxil edilməlidir (bax DEPLOY.md).
      - key: JWT_SECRET
        type: SECRET
      - key: ADMIN_INITIAL_PASSWORD
        type: SECRET
      - key: MAIL_USERNAME
        type: SECRET
      - key: MAIL_PASSWORD
        type: SECRET
      - key: STRIPE_PUBLISHABLE_KEY
        type: SECRET
      - key: STRIPE_SECRET_KEY
        type: SECRET
      - key: VAPID_PUBLIC_KEY
        type: SECRET
      - key: VAPID_PRIVATE_KEY
        type: SECRET
      # Boş buraxıla bilər — AiChatService konfiqurasiya olunmayanda tətbiq
      # yenə açılır, sadəcə AI chat söylər ki, hələ hazır deyil.
      - key: GROQ_API_KEY
        type: SECRET

static_sites:
  - name: frontend
    source_dir: frontend
    github:
      repo: Nail499/LogisticsProjectFinal
      branch: master
      deploy_on_push: true
    build_command: npm run build
    output_dir: dist
    envs:
      # Vite dəyişənləri build zamanı kod içinə "bişirilir" (runtime-da
      # oxunmur), ona görə BUILD_TIME scope məcburidir. Frontend/backend
      # eyni domendə olduğu üçün ${APP_URL} istifadə olunur (bax ingress).
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${APP_URL}

# Tək paylaşılan domendə hər path-i düzgün komponentə yönləndirir. SIRA
# VACİBDİR — daha spesifik path-lər (/api, /ws, ...) "/" tutucu qaydasından
# ƏVVƏL gəlməlidir, əks halda onu heç vaxt görməzlər.
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /ws
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /uploads
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /swagger-ui
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /v3/api-docs
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /actuator
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: frontend

databases:
  - name: db
    engine: PG
    version: "16"
    production: false
    size: db-s-dev-database
